name: 🚀 Deploy to Production

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📁 Verify files exist
      run: |
        if [ -f "./docker/Dockerfile" ]; then
          echo "✅ Dockerfile found at ./docker/Dockerfile"
        else
          echo "❌ Dockerfile not found at ./docker/Dockerfile"
          exit 1
        fi
        
        if [ -f "docker/docker-compose.yml" ]; then
          echo "✅ docker-compose.yml found"
        else
          echo "❌ docker-compose.yml not found"
          exit 1
        fi

    - name: 🔐 Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

    - name: 🏗️ Build Docker image
      run: |
        docker build -t spectrum-club-bot:${{ github.sha }} -f ./docker/Dockerfile .
        docker save spectrum-club-bot:${{ github.sha }} | gzip > bot-image.tar.gz
      env:
        DOCKER_BUILDKIT: 1
        BUILDKIT_PROGRESS: plain

    - name: 📝 Create .env file locally
      run: |
        # Создаем .env файл
        cat > .env << 'EOF'
        DB_USER=${{ secrets.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        DB_NAME=${{ secrets.DB_NAME }}
        BOT_TOKEN=${{ secrets.BOT_TOKEN }}
        DB_SSL_MODE=disable
        LOG_LEVEL=info
        BOT_DEBUG=false
        ENVIRONMENT=${{ secrets.ENVIRONMENT }}
        BASE_URL=${{ secrets.BASE_URL }}
        IMAGE_TAG=${{ github.sha }}
        HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}
        HTTP_PROXY=${{ secrets.HTTP_PROXY }}
        NO_PROXY=${{ secrets.NO_PROXY }}
        EOF
        
        echo "✅ .env file created"
        echo "📄 .env content (keys only):"
        cat .env | sed 's/=.*/=[HIDDEN]/'

    - name: 📦 Copy files to server
      run: |
        scp -o StrictHostKeyChecking=no \
            bot-image.tar.gz \
            docker/docker-compose.yml \
            .env \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:/opt/spectrum-bot/
        # Копируем веб-шаблоны рекурсивно
        # scp -r -o StrictHostKeyChecking=no \
        #     web/ \
        #     ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:/opt/spectrum-bot/
        echo "✅ All files copied successfully"

    - name: 🚀 Deploy on server
      run: |
        ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} "
          set -e
          
          echo '📦 Loading Docker image...'
          cd /opt/spectrum-bot
          docker load -i bot-image.tar.gz
          
          echo '🔍 Getting PostgreSQL container IP...'
          # Получаем IP адрес контейнера postgres-db-spectrum
          POSTGRES_IP=\$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' postgres-db-spectrum)
          echo \"PostgreSQL IP: \${POSTGRES_IP}\"
          
          echo '📝 Updating .env with PostgreSQL IP...'
          # Обновляем .env файл с IP вместо имени хоста
          sed -i \"s|DB_HOST=.*|DB_HOST=\${POSTGRES_IP}|\" .env
          echo \"Updated DB_HOST to: \${POSTGRES_IP}\"
          
          echo '🔄 Updating docker-compose.yml with new tag...'
          sed -i 's|image: spectrum-club-bot:.*|image: spectrum-club-bot:${{ github.sha }}|' docker-compose.yml
          
          echo '🚀 Starting bot...'
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose --env-file .env up -d
          
          echo '⏳ Waiting for bot to start...'
          sleep 10
          
          echo '🔍 Bot logs:'
          docker compose logs --tail=20 bot
        "